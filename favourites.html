        {name:"罗斯冰架",continent:"南极洲",country:"罗斯海",tag:"bg-blue-100 text-blue-700",img:"https://images.unsplash.com/photo-1542259009477-d625272157b7",desc:"世界最大浮动冰架，巨大冰山崩落，极地壮阔冰原景观。"},
        {name:"南极极光带",continent:"南极洲",country:"南极圈",tag:"bg-violet-100 text-violet-600",img:"https://images.unsplash.com/photo-1531366936337-7c912a4589a7",desc:"南极光绿紫色光幕横跨夜空，极地独有的天文奇观。"},
        {name:"南极科考站",continent:"南极洲",country:"多国共建",tag:"bg-slate-100 text-slate-600",img:"https://images.unsplash.com/photo-1589859849388-6e836a61c800",desc:"各国极地科研基地，人类探索南极大陆的前哨站点。"},
    ];

    // ========== 全局状态 ==========
    const toastEl = document.getElementById('toastMsg');
    const favList = document.getElementById('favouritesList');
    const favCount = document.getElementById('favCount');
    const demoQuickAdd = document.getElementById('demoQuickAdd');
    const userPanel = document.getElementById('userPanel');
    const loginBtn = document.getElementById('loginBtn');
    const loginBtnText = document.getElementById('loginBtnText');
    const mobileLoginBtn = document.getElementById('mobileLoginBtn');
    const menuBtn = document.getElementById('menuBtn');
    const mobileMenu = document.getElementById('mobileMenu');

    // 推荐列表用景点前三项（来自不同洲，方便快速体验）
    const demoIndices = [0, 21, 14]; // 万里长城、埃菲尔铁塔、吉萨金字塔群

    let currentFavs = [];
    let detailsFavs = [];

    // ========== Toast ==========
    function showToast(msg, duration) {
        if (!toastEl) return;
        toastEl.textContent = msg;
        toastEl.classList.add('show');
        clearTimeout(toastEl._timer);
        toastEl._timer = setTimeout(() => toastEl.classList.remove('show'), duration || 2000);
    }

    // ========== 收藏操作 ==========
    function getFavKey() {
        const user = localStorage.getItem('lastUser');
        return user ? `favs_${user}` : 'favs_default';
    }

    function getUserKey(username) {
        return `user_${username}`;
    }

    function readUser(username) {
        if (!username) return null;
        try {
            return JSON.parse(localStorage.getItem(getUserKey(username)) || 'null');
        } catch {
            return null;
        }
    }

    function renameStorageKey(oldKey, newKey) {
        const value = localStorage.getItem(oldKey);
        if (value === null) return;
        localStorage.setItem(newKey, value);
        localStorage.removeItem(oldKey);
    }

    function loadFavs() {
        try {
            currentFavs = JSON.parse(localStorage.getItem(getFavKey())) || [];
        } catch { currentFavs = []; }
        // 去重
        currentFavs = [...new Set(currentFavs)];
        // 同时加载来自详情页的收藏
        loadDetailsFavs();
    }

    function loadDetailsFavs() {
        const username = localStorage.getItem('lastUser');
        if (!username) { detailsFavs = []; return; }
        try {
            const raw = localStorage.getItem(`details_favs_${username}`);
            detailsFavs = raw ? JSON.parse(raw) : [];
        } catch { detailsFavs = []; }
    }

    function saveDetailsFavs() {
        const username = localStorage.getItem('lastUser');
        if (username) {
            localStorage.setItem(`details_favs_${username}`, JSON.stringify(detailsFavs));
        }
    }

    function resolveFavImageSrc(img) {
        if (!img) return '';
        if (/^https?:\/\//i.test(img) || img.startsWith('data:')) return img;
        return img.replace(/^\.\.\/details-attractions\//, '').replace(/^\.\//, '');
    }

    function getCombinedFavCount() {
        return currentFavs.length + detailsFavs.length;
    }

    function removeDetailsFav(id) {
        detailsFavs = detailsFavs.filter(f => f.id !== id);
        saveDetailsFavs();
        renderFavs();
        showToast('已移除收藏');
    }

    function saveFavs() {
        localStorage.setItem(getFavKey(), JSON.stringify(currentFavs));
    }

    function addFav(index) {
        if (currentFavs.includes(index)) {
            showToast('已在收藏列表中');
            return;
        }
        currentFavs.push(index);
        saveFavs();
        renderFavs();
        renderRecommend();
        showToast(`已收藏「${spotData[index].name}」`);
    }

    function removeFav(index) {
        currentFavs = currentFavs.filter(i => i !== index);
        saveFavs();
        renderFavs();
        renderRecommend();
        showToast(`已移除「${spotData[index].name}」`);
    }

    // ========== 渲染收藏（合并 spotData 索引 + 详情页收藏） ==========
    function renderFavs() {
        if (!favList) return;

        const combinedCount = getCombinedFavCount();
        if (combinedCount === 0) {
            favList.innerHTML = `
                <div class="empty">
                    <i class="fas fa-heart"></i>
                    <span>收藏列表还空空的<br>去下方<strong>推荐景点</strong>添加一些吧<br><small style="color:var(--fb-muted)">也可以在景点详情页收藏世界各地的景点</small></span>
                </div>
            `;
            if (favCount) favCount.textContent = '0';
            return;
        }

        let html = '';

        // 1. spotData 索引收藏
        currentFavs.forEach(idx => {
            const d = spotData[idx];
            if (!d) return;
            html += `
                <div class="fav-grid-item">
                    <div class="fav-img" style="background-image: url('${d.img}');">
                        <span class="fav-img-label">${d.name}</span>
                        <button class="fav-remove" onclick="removeFav(${idx})" title="移除收藏">
                            <i class="fas fa-times"></i>
                        </button>
                    </div>
                    <div class="fav-info">
                        <div class="fav-name">${d.name}</div>
                        <div class="fav-desc">${d.desc}</div>
                    </div>
                </div>
            `;
        });

        // 2. 详情页收藏（带真实图片）
        detailsFavs.forEach(item => {
            const imgSrc = resolveFavImageSrc(item.img);
            html += `
                <div class="fav-grid-item">
                    <div class="fav-img" style="background-image: url('${imgSrc}');">
                        <span class="fav-img-label">${item.name}</span>
                        <button class="fav-remove" onclick="removeDetailsFav('${item.id}')" title="移除收藏">
                            <i class="fas fa-times"></i>
                        </button>
                    </div>
                    <div class="fav-info">
                        <div class="fav-name">${item.name}</div>
                        <div class="fav-desc">${item.country}${item.city ? ' · ' + item.city : ''}</div>
                    </div>
                </div>
            `;
        });

        favList.innerHTML = html;
        if (favCount) favCount.textContent = combinedCount;
    }

    // ========== 渲染推荐 ==========
    function renderRecommend() {
        if (!demoQuickAdd) return;
        demoQuickAdd.innerHTML = demoIndices.map(idx => {
            const d = spotData[idx];
            const added = currentFavs.includes(idx);
            return `
                <div class="recommend-item" onclick="${added ? '' : "addFav("+idx+")"}">
                    <div class="recommend-img" style="background-image: url('${d.img}');">
                        <span class="recommend-img-label">${d.name}</span>
                        <button class="recommend-add ${added ? 'added' : ''}" ${added ? '' : 'onclick="event.stopPropagation(); addFav('+idx+')"'}>
                            <i class="fas ${added ? 'fa-check' : 'fa-plus'}"></i>
                        </button>
                    </div>
                    <div class="recommend-info">
                        <div class="recommend-name">${d.name}</div>
                        <div class="recommend-desc-text">${d.continent} · ${d.country}</div>
                    </div>
                </div>
            `;
        }).join('');
    }

    // ========== 用户面板 ==========
    function renderUserPanel() {
        if (!userPanel) return;
        const username = localStorage.getItem('lastUser');
        if (!username) {
            userPanel.innerHTML = `
                <div class="user-box">
                    <div class="avatar"><i class="fas fa-user"></i></div>
                    <div>
                        <div class="username">未登录</div>
                        <div class="user-meta">请先登录</div>
                    </div>
                </div>
            `;
            return;
        }
        const initial = username.charAt(0).toUpperCase();
        userPanel.innerHTML = `
            <div class="user-box">
                <div class="avatar">${initial}</div>
                <div>
                    <div class="username">${username}</div>
                    <div class="user-meta">旅行收藏家</div>
                </div>
            </div>
                <button class="logout-btn" type="button" title="设置" onclick="openSettings()">
                <i class="fas fa-gear"></i>
            </button>
        `;
    }

    // ========== 导航栏用户头像 ==========
    function renderNavUser() {
        const username = localStorage.getItem('lastUser');
        if (!username) {
            if (loginBtnText) loginBtnText.textContent = '登录';
            if (loginBtn) {
                loginBtn.classList.add('bg-travel', 'hover:bg-primary');
                loginBtn.classList.remove('bg-gray-700', 'hover:bg-gray-800');
                loginBtn.title = '点击登录';
                loginBtn.onclick = openLogin;
            }
            if (mobileLoginBtn) {
                mobileLoginBtn.innerHTML = `<i class="fa-solid fa-user mr-1"></i>登录`;
                mobileLoginBtn.title = '点击登录';
                mobileLoginBtn.onclick = openLogin;
            }
            return;
        }
        if (loginBtnText) loginBtnText.textContent = '我的';
        if (loginBtn) {
            loginBtn.classList.remove('bg-travel', 'hover:bg-primary');
            loginBtn.classList.add('bg-gray-700', 'hover:bg-gray-800');
            loginBtn.title = '点击进入我的收藏';
            loginBtn.onclick = () => { window.location.href = 'favourites.html'; };
        }
        if (mobileLoginBtn) {
            mobileLoginBtn.innerHTML = `<i class="fa-solid fa-heart mr-1"></i>我的`;
            mobileLoginBtn.title = '点击进入我的收藏';
            mobileLoginBtn.onclick = () => { window.location.href = 'favourites.html'; };
        }
    }

    // ========== 退出登录 ==========
    window.handleLogout = function() {
        localStorage.removeItem('lastUser');
        showToast('已退出登录');
        renderUserPanel();
        renderNavUser();
        setTimeout(() => {
            window.location.href = 'index.html';
        }, 800);
    };

    window.openSettings = function() {
        if (!localStorage.getItem('lastUser')) {
            openLogin();
            return;
        }
        window.location.href = 'settings.html';
    };

    if (menuBtn && mobileMenu) {
        menuBtn.addEventListener('click', () => {
            mobileMenu.classList.toggle('hidden');
        });
    }

    // ========== 初始化 ==========
    loadFavs();
    renderFavs();
    renderRecommend();
    renderUserPanel();
    renderNavUser();
    </script>
</body>
</html>
